<main class="flex justify-center items-center w-screen h-screen bg-gray-100">
  <div
    class="flex flex-col p-20 rounded-md shadow-md bg-white gap-10 w-full max-w-md"
  >
    @if (showCopied) {
    <div
      class="absolute top-0 right-0 mt-2 mr-2 bg-green-500 text-white px-3 py-1 rounded-full text-sm"
    >
      Copied!
    </div>
    }
    <h1 class="text-3xl font-bold">Password Generator</h1>

    <div
      class="relative bg-gray-100 p-4 rounded-lg font-mono text-lg min-h-[3rem] flex-wrap text-wrap break-words"
    >
      @if (password) {
      {{ password }}
      <button
        (click)="copyToClipboard()"
        class="absolute bottom-0 right-0 bg-black/50 hover:bg-black text-white px-3 py-1 rounded-md text-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
          />
        </svg>
      </button>
      } @else {
      <span class="text-gray-500">Click Generate</span>
      }
    </div>

    <div class="flex items-center gap-4">
      <label for="length" class="min-w-32">Password Length:</label>
      <input
        type="number"
        id="length"
        min="4"
        max="64"
        [(ngModel)]="passwordLength"
        (input)="updateLength($event)"
        class="w-20 p-2 border rounded"
      />
    </div>

    @for (option of passwordOptions; track option.id) {
    <div class="flex items-center gap-4">
      <label class="flex items-center gap-2 min-w-32">
        <input
          type="checkbox"
          [ngModel]="option.enabled"
          (ngModelChange)="updateOptionEnabled(option.id, $event)"
          class="w-4 h-4"
        />
        {{ option.label }}
      </label>
    </div>
    }

    <button
      (click)="generatePassword()"
      [disabled]="!isValidConfig()"
      class="w-full py-3 px-6 bg-blue-600 text-white rounded-lg disabled:bg-gray-400 disabled:cursor-not-allowed hover:bg-blue-700 transition-colors"
    >
      Generate Password
    </button>
  </div>
</main>
